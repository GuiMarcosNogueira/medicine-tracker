<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="86.6%" y2="50%">
      <stop offset="0%" stop-color="#22C9BF"/>
      <stop offset="100%" stop-color="#147570"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D0F7F5"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="0" y="0" width="1024" height="1024" rx="236" ry="236" fill="url(#bgGrad)"/>

  <!-- Medical cross — horizontal bar -->
  <rect x="320" y="448" width="384" height="128" rx="20" ry="20" fill="url(#crossGrad)"/>
  <!-- Medical cross — vertical bar -->
  <rect x="448" y="320" width="128" height="384" rx="20" ry="20" fill="url(#crossGrad)"/>

  <!-- Coral accent pill — bottom right, rotated -30° -->
  <g transform="translate(800, 800) rotate(-30)">
    <rect x="-56" y="-22" width="112" height="44" rx="22" ry="22" fill="#F0735A" opacity="0.9"/>
  </g>
</svg>
